# Release pipeline: runs on push to main. Builds the image, scans it, pushes it
# to ECR by DIGEST, then commits that digest into gitops/. It never talks to
# the Kubernetes cluster — Argo CD sees the git change and deploys. That
# CI-stops-at-git boundary is the core design point of this submission.
#
# Auth to AWS is via GitHub OIDC → a short-lived role. No static AWS keys exist
# anywhere in the repo or in GitHub secrets.
name: ci-main

on:
  push:
    branches: [main]
    # Don't rebuild on doc-only or gitops-only changes. Crucially this also
    # means the digest commit this workflow makes (which touches gitops/**)
    # does not retrigger the workflow — belt-and-braces with [skip ci].
    paths:
      - "app/**"
      - "charts/**"
      - ".github/workflows/ci-main.yaml"

# OIDC needs id-token: write. contents: write so the job can commit the digest.
permissions:
  id-token: write
  contents: write

concurrency:
  group: ci-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hello-world

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Build to a local image first so Trivy can scan it before it is pushed.
      # Only images that pass the scan reach the registry.
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: local/scan-target:${{ github.sha }}
          target: runtime
          build-args: |
            APP_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/scan-target:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Push by tag; the action returns the resulting digest, which is what we
      # actually deploy. Tag is immutable in ECR, digest is the source of truth.
      - name: Push image to ECR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          target: runtime
          build-args: |
            APP_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha

  update-gitops:
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need a full checkout to commit and push back.
          persist-credentials: true

      - name: Pin the new digest in gitops values
        env:
          DIGEST: ${{ needs.build-scan-push.outputs.digest }}
        run: |
          set -euo pipefail
          f=gitops/apps/values/hello-world-values.yaml
          # Replace the `digest: "..."` line with the freshly pushed digest.
          # yq would be cleaner; sed keeps the runner dependency-free.
          sed -i -E "s|(^  digest: ).*|\1\"${DIGEST}\"|" "$f"
          echo "Updated digest to ${DIGEST}"
          git diff --stat

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No digest change; nothing to commit."
            exit 0
          fi
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add gitops/apps/values/hello-world-values.yaml
          # [skip ci] stops this gitops commit from retriggering CI.
          git commit -m "ci: deploy ${GITHUB_SHA::12} [skip ci]"
          git push
